name: Terraform - Landing Zone

on:
  pull_request:
    paths:
      - "terraform/**"
      - "config/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for plan/apply"
        required: false
        default: "dev"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/core
        run: terraform init -backend-config="key=landingzone-${{ env.ENVIRONMENT }}.tfstate"

      - name: Terraform Plan
        working-directory: terraform/core
        run: |
          terraform plan \
            -input=false \
            -var "environment=${{ env.ENVIRONMENT }}" \
            -var "config_file=../../config/envs/${{ env.ENVIRONMENT }}.landingzone.yaml"

  apply:
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ENVIRONMENT: dev
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/core
        run: terraform init -backend-config="key=landingzone-${{ env.ENVIRONMENT }}.tfstate"

      - name: Terraform Apply (dev)
        working-directory: terraform/core
        run: |
          terraform apply -auto-approve \
            -input=false \
            -var "environment=${{ env.ENVIRONMENT }}" \
            -var "config_file=../../config/envs/${{ env.ENVIRONMENT }}.landingzone.yaml"
